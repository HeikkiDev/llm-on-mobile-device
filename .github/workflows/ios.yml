name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

jobs:
  build-and-test:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | awk '/^-- iOS 27/{f=1;next} /^--/{f=0} f && /iPhone/' | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild test \
            -project Translator.xcodeproj \
            -scheme Translator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO

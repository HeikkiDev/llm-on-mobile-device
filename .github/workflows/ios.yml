name: iOS

on:
  push:
    branches: [main, walter]
    paths: ['ios/**', 'scripts/check.sh', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/check.sh', '.github/workflows/ios.yml']

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: scripts/check.sh ios
        env:
          CHECK_STRICT: '1'

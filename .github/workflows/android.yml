name: Android

on:
  push:
    branches: [main, walter]
    paths: ['android/**', 'scripts/check.sh', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/check.sh', '.github/workflows/android.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: scripts/check.sh android
        env:
          CHECK_STRICT: '1'
